name: witness pr check
# On a pull request that changes the TodoMVC Svelte example: replay its Kane tests on the PR's build.
# When a test fails, replay the same recording on the base branch's build and post the verdict and the card.
on:
  pull_request:
    paths: ["examples/todomvc-svelte/**"]

permissions:
  contents: read
  pull-requests: write

jobs:
  witness:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP: examples/todomvc-svelte
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.pull_request.base.sha }}", path: base }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build the app from this pull request (target)
        run: cd $APP/app && npm ci && npm run build
      - name: Build the app from the base branch (reference)
        run: |
          cd base/$APP/app && npm ci && npm run build
          mkdir -p $GITHUB_WORKSPACE/$APP/reference && cp -r dist $GITHUB_WORKSPACE/$APP/reference/dist
      - name: WITNESS (the published action, from npm kane-witness)
        uses: ./
        with:
          working-directory: ${{ env.APP }}
          kane-username: ${{ secrets.KANE_USERNAME }}
          kane-access-key: ${{ secrets.KANE_ACCESS_KEY }}
